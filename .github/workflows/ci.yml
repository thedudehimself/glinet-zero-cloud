name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: pip install pytest
      - name: Shell & Python syntax checks
        run: |
          sh -n router/etc/firewall.user router/etc/hotplug.d/firewall/90-van-wan-guard router/usr/bin/van-wan router/www/cgi-bin/van-wan router/usr/libexec/van-wan-guard/*.sh
          bash -n deploy/*.sh
          python3 -m py_compile src/*.py deploy/import-wifi.py
      - name: Run unit test suite
        run: PYTHONPATH=src:deploy pytest -v
